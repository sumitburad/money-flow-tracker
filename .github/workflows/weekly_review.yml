name: Weekly monitor health and label stability
on:
  workflow_dispatch:
  schedule:
    # Sunday 10:00 IST.
    - cron: "30 4 * * 0"
permissions:
  contents: write
concurrency:
  group: money-flow-weekly
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python scripts/weekly_review.py
      - name: Archive written weekly audit
        run: |
          git config user.name "money-flow-bot"
          git config user.email "money-flow-bot@users.noreply.github.com"
          git add data/reviews docs/reviews frontend/reviews briefs/weekly
          if git diff --cached --quiet; then
            echo "No updated review"
          else
            git commit -m "research: archive weekly source and label review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
