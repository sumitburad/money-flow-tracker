name: Daily money-flow refresh

# Runs by itself every day (times below are IST), or when you press "Run workflow".
#   07:37 morning refresh (after the US market close)
#   10:07 morning backup  - only runs if the morning refresh is missing or needed a retry
#   19:07 evening refresh
#   21:37 evening backup  - same rule
# The cron lines are in UTC, which is IST minus 5 h 30 min.
on:
  schedule:
    - cron: "7 2 * * *"
    - cron: "37 4 * * *"
    - cron: "37 13 * * *"
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two updates never collide. A waiting run is not cancelled.
concurrency:
  group: money-flow-scheduled
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect data and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Always start from the newest saved version of main. Without this, a run that had
          # to wait for another run would start from the older version that existed when it
          # was triggered, and its data could get mixed with the other run's (23 Nov 2026).
          ref: main

      - name: Is this run needed?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/should_run.py --event "$EVENT" --schedule "$SCHEDULE"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install tools
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r backend/requirements.txt

      - name: Collect official data (tries up to 3 times by itself)
        if: steps.gate.outputs.run == 'true'
        env:
          RUN_SLOT: ${{ steps.gate.outputs.slot }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt ${attempt} of 3"
            if python -m backend.run_daily; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt ${attempt} failed."
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          echo "All 3 attempts failed. The previous data stays on the dashboard." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check the new data is well formed
        if: steps.gate.outputs.run == 'true'
        run: python scripts/validate_feed.py data/feed/v1/latest.json

      - name: Update the history files (never stops the refresh)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/backfill_official.py --mode update

      - name: Copy files to the website folder
        if: steps.gate.outputs.run == 'true'
        run: python scripts/sync_site.py

      - name: Publish (commit and push, retries if needed)
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/commit_and_push.sh

      - name: Short result for this run
        if: always() && steps.gate.outputs.run == 'true'
        run: python scripts/summarize_run.py

      - name: Keep logs if something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: money-flow-failure-${{ github.run_id }}
          path: |
            docs/status.json
            data/health/
          if-no-files-found: ignore
          retention-days: 7
