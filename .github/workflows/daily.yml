name: Global money-flow daily research
# Paused 2026-11-18 by owner request until macro/news research is complete.
# Manual-only workflow; no scheduled or push-triggered data/news collection.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: money-flow-scheduled
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Unit and contract tests
        run: python -m pytest -q tests
      - name: Collect official data and research price proxies
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m backend.run_daily
      - name: Reject invalid or non-cited output
        run: python scripts/validate_feed.py data/feed/v1/latest.json
      - name: Synchronize Vercel and Pages static sites
        run: python scripts/sync_site.py
      - name: Commit immutable daily labels and public research feed
        run: |
          git config user.name "money-flow-bot"
          git config user.email "money-flow-bot@users.noreply.github.com"
          git add data docs briefs reports frontend
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "research: publish sourced money-flow snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload run health and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: money-flow-failure-${{ github.run_id }}
          path: |
            docs/status.json
            data/health/
          if-no-files-found: ignore
          retention-days: 7
