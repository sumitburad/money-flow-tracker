verified_as_of: 2026-11-15
sources:
  yfinance_research_only:
    kind: unofficial_price_proxy
    key_required: false
    public_redistribution: false
    note: "Existing personal-research collector; no Yahoo OHLCV or quotes are written to the public feed. Review provider terms before use."
    fallback: unavailable
  fred_csv:
    kind: official_macro
    key_required: false
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv"
    fallback: dbnomics_fed_h15_for_verified_yields
  dbnomics_fed_h15_for_verified_yields:
    kind: official_fed_observations_through_keyless_mirror
    key_required: false
    url: "https://api.db.nomics.world/v22/series/FED/H15"
    verified_mappings: "DGS2=RIFLGFCY02_N.B; DGS10=RIFLGFCY10_N.B"
    fallback: unavailable
    note: "Unmapped series remain unavailable. Mirror observed dates and origin are preserved."
  treasury_daily_par_curve:
    kind: official_us_treasury_daily_par_yield_curve
    key_required: false
    url: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all"
    fallback: unavailable
    note: "Not interchangeable with FRED H15 DGS2 or DGS10. Preserve both by distinct series IDs."
  fed_rss:
    kind: official_headlines
    key_required: false
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    fallback: ecb_rss
  ecb_rss:
    kind: official_headlines
    key_required: false
    url: "https://www.ecb.europa.eu/rss/press.html"
    fallback: unavailable
