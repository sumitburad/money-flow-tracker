# Official-source history loaded by scripts/backfill_official.py
# - Official or official-origin data only. NO market price data (no OHLCV, no quotes).
# - start_date was approved by Sumit for R-1.
# - "lag" is a conservative ESTIMATE of how long after the observation date the value
#   became public. It is not a true vintage date; values are the current vintage
#   (later revisions are not tracked). Downstream tests must use the available_from column.
start_date: "2021-11-22"

fred:
  DGS2:
    title: "US 2-year Treasury yield (Fed H.15)"
    provider: "Board of Governors of the Federal Reserve System, via FRED"
    frequency: daily
    unit: percent
    lag: {business_days: 2}
  DGS10:
    title: "US 10-year Treasury yield (Fed H.15)"
    provider: "Board of Governors of the Federal Reserve System, via FRED"
    frequency: daily
    unit: percent
    lag: {business_days: 2}
  DFF:
    title: "US federal funds effective rate (Fed H.15)"
    provider: "Board of Governors of the Federal Reserve System, via FRED"
    frequency: daily
    unit: percent
    lag: {business_days: 2}
  T10Y2Y:
    title: "US 10-year minus 2-year Treasury yield spread"
    provider: "Federal Reserve Bank of St. Louis, calculated from Fed H.15 yields, via FRED"
    frequency: daily
    unit: percentage_points
    lag: {business_days: 2}
  T10YIE:
    title: "US 10-year breakeven inflation rate"
    provider: "Federal Reserve Bank of St. Louis, calculated from Treasury yields, via FRED"
    frequency: daily
    unit: percent
    lag: {business_days: 2}
  UNRATE:
    title: "US unemployment rate (Bureau of Labor Statistics)"
    provider: "U.S. Bureau of Labor Statistics, via FRED"
    frequency: monthly
    unit: percent
    lag: {calendar_days: 35}
  RRPONTSYD:
    title: "Overnight reverse repo operations (New York Fed)"
    provider: "Federal Reserve Bank of New York, via FRED"
    frequency: daily
    unit: billions_usd
    lag: {business_days: 2}
  DTWEXBGS:
    title: "Nominal broad US dollar index (Fed H.10)"
    provider: "Board of Governors of the Federal Reserve System, via FRED"
    frequency: daily
    unit: index_jan_2006_100
    lag: {calendar_days: 8}
  DEXINUS:
    title: "India rupees per US dollar (Fed H.10)"
    provider: "Board of Governors of the Federal Reserve System, via FRED"
    frequency: daily
    unit: inr_per_usd
    lag: {calendar_days: 8}
  WALCL:
    title: "Federal Reserve total assets (H.4.1, Wednesday level)"
    provider: "Board of Governors of the Federal Reserve System, via FRED"
    frequency: weekly
    unit: millions_usd
    lag: {calendar_days: 3}
  WTREGEN:
    title: "US Treasury General Account (H.4.1, Wednesday level)"
    provider: "Board of Governors of the Federal Reserve System, via FRED"
    frequency: weekly
    unit: millions_usd
    lag: {calendar_days: 3}
  ECBASSETSW:
    title: "Eurosystem total assets (ECB weekly statement)"
    provider: "European Central Bank, via FRED"
    frequency: weekly
    unit: millions_eur
    lag: {calendar_days: 6}
  M2SL:
    title: "US M2 money stock (seasonally adjusted)"
    provider: "Board of Governors of the Federal Reserve System, via FRED"
    frequency: monthly
    unit: billions_usd
    lag: {calendar_days: 65}
  JPNASSETS:
    title: "Bank of Japan total assets"
    provider: "Bank of Japan, via FRED"
    frequency: monthly
    unit: hundred_million_yen
    lag: {calendar_days: 75}

# Inflation, as "change from a year earlier". Calculated here from a FRED price index:
#     (index this month / index 12 months earlier - 1) x 100
# The index itself is not saved; each row's date is the month the index describes.
# CPI is the not-seasonally-adjusted index (that is how the agency quotes its 12-month
# change); PCE is the seasonally adjusted chain price index. "lag" is the base index's
# publication lag, padded: CPI comes out about 6 weeks after the month, PCE about 8.
# The base index is fetched one year before start_date so the first row can be calculated.
fred_yoy:
  CPI_YOY:
    base: CPIAUCNS
    title: "US consumer prices (CPI), all items: change from a year earlier"
    provider: "U.S. Bureau of Labor Statistics, via FRED; change from a year earlier calculated here"
    frequency: monthly
    unit: percent
    lag: {calendar_days: 48}
    group: cpi
    line_name: "All items"
  CPI_CORE_YOY:
    base: CPILFENS
    title: "US core CPI (excluding food and energy): change from a year earlier"
    provider: "U.S. Bureau of Labor Statistics, via FRED; change from a year earlier calculated here"
    frequency: monthly
    unit: percent
    lag: {calendar_days: 48}
    group: cpi
    line_name: "Core (excl. food and energy)"
  PCE_YOY:
    base: PCEPI
    title: "US PCE price index, all items: change from a year earlier"
    provider: "U.S. Bureau of Economic Analysis, via FRED; change from a year earlier calculated here"
    frequency: monthly
    unit: percent
    lag: {calendar_days: 65}
    group: pce
    line_name: "All items"
  PCE_CORE_YOY:
    base: PCEPILFE
    title: "US core PCE price index (excluding food and energy): change from a year earlier"
    provider: "U.S. Bureau of Economic Analysis, via FRED; change from a year earlier calculated here"
    frequency: monthly
    unit: percent
    lag: {calendar_days: 65}
    group: pce
    line_name: "Core (excl. food and energy)"

treasury_par:
  provider: "U.S. Department of the Treasury (daily par yield curve)"
  unit: percent
  frequency: daily
  lag: {business_days: 1}
  columns:
    "3 Mo": UST_PAR_3M
    "2 Yr": UST_PAR_2Y
    "10 Yr": UST_PAR_10Y
    "30 Yr": UST_PAR_30Y

cftc:
  provider: "U.S. Commodity Futures Trading Commission (Traders in Financial Futures, futures only)"
  frequency: weekly
  lag: {calendar_days: 4}   # Tuesday positions are released the following Friday
  names:                    # plain names shown on the dashboard
    sp500: "S&P 500"
    nasdaq100: "Nasdaq-100"
    us_treasury: "US 10-year Treasury note"
    dollar: "US dollar index"
